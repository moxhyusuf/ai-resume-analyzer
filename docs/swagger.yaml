basePath: /api/v1
definitions:
  auth.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/user.User'
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
      password:
        minLength: 3
        type: string
    required:
    - email
    - name
    - password
    type: object
  response.APIResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  resume.AnalysisResult:
    properties:
      created_at:
        type: string
      id:
        type: string
      keywords:
        items:
          type: string
        type: array
      overall_score:
        type: integer
      resume_id:
        type: string
      sections:
        items:
          $ref: '#/definitions/resume.Section'
        type: array
      suggestions:
        items:
          type: string
        type: array
      summary_feedback:
        type: string
    type: object
  resume.AnalyzeResponse:
    properties:
      analysis:
        $ref: '#/definitions/resume.AnalysisResult'
      resume_id:
        type: string
    type: object
  resume.Resume:
    properties:
      analysis:
        $ref: '#/definitions/resume.AnalysisResult'
      created_at:
        type: string
      id:
        type: string
      original_name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  resume.Section:
    properties:
      feedback:
        type: string
      name:
        type: string
      score:
        type: integer
    type: object
  user.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API untuk analisis resume menggunakan Groq AI
  title: AI Resume Analyzer API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login dengan email dan password, mendapatkan JWT token
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Login user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Membuat akun baru dengan nama, email, dan password
      parameters:
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Register user baru
      tags:
      - Auth
  /resumes:
    get:
      description: Mendapatkan semua resume milik user yang login
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/resume.Resume'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List semua resume
      tags:
      - Resume
  /resumes/{id}:
    delete:
      parameters:
      - description: Resume ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Hapus resume
      tags:
      - Resume
    get:
      description: Mendapatkan detail resume beserta hasil analisis
      parameters:
      - description: Resume ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/resume.Resume'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Detail resume
      tags:
      - Resume
  /resumes/analyze:
    post:
      consumes:
      - multipart/form-data
      description: Upload PDF resume untuk dianalisis oleh AI
      parameters:
      - description: File PDF resume
        in: formData
        name: resume
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/resume.AnalyzeResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Analyze resume
      tags:
      - Resume
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
